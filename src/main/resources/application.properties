spring.application.name=helpdesk

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campus_helpdesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server configuration
server.port=8080
server.servlet.session.timeout=30m

# Show error messages in API responses (needed for meaningful error toasts in frontend)
server.error.include-message=always
server.error.include-binding-errors=always
